[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distributedcc"
version = "0.1.0"
description = "Private-protocol bridge for event-driven Claude Code peer messaging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets==16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[project.scripts]
distributedcc-server = "distributedcc.server:main"
distributedcc-bridge = "distributedcc.bridge:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
