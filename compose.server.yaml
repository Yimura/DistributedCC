services:
  broker:
    image: ${DCC_IMAGE:-ghcr.io/yimura/distributedcc:latest}
    command: distributedcc-server
    environment:
      DCC_NODE_TOKENS_FILE: /run/configs/node-tokens.json
      DCC_SERVER_HOST: 0.0.0.0
      DCC_SERVER_PORT: "8765"
    configs:
      - source: node_tokens
        target: /run/configs/node-tokens.json
    expose:
      - "8765"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      - broker
    environment:
      DCC_DOMAIN: ${DCC_DOMAIN:?Set public broker domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

configs:
  node_tokens:
    content: |
      {
        "andre": "${DCC_NODE_TOKEN_ANDRE:?Set Andre node token}",
        "friend": "${DCC_NODE_TOKEN_FRIEND:?Set friend node token}"
      }

volumes:
  caddy_data:
  caddy_config:
