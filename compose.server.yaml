services:
  broker:
    build: .
    command: distributedcc-server
    environment:
      DCC_NODE_TOKENS: ${DCC_NODE_TOKENS:?Set JSON token-to-node mapping}
      DCC_SERVER_HOST: 0.0.0.0
      DCC_SERVER_PORT: "8765"
    expose:
      - "8765"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      - broker
    environment:
      DCC_DOMAIN: ${DCC_DOMAIN:?Set public broker domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
